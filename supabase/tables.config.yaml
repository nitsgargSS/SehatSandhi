# Classification for every table and view in the database.
#
# This is schema metadata, so it lives next to the schema rather than inside any
# one script. Nothing in Supabase reads this file — it is ours.
#
# Three consumers:
#   scripts/sync-reference.mjs        class 'sync' tables, using `key` as the upsert conflict target
#   supabase/functions/sandbox-purge  class 'isolated' tables, in ascending purgeOrder
#   scripts/check-table-config.mjs    fails if a table in the schema is unclassified
#
# Classes:
#   sync         Reference/config data pulled prod -> sandbox. Never purged.
#   isolated     User-generated. Never copied between databases. Purged in sandbox.
#   view         Not a table; skipped by both sync and purge.
#   never_purge  Infrastructure that must survive a purge.
#
# purgeOrder deletes children before parents and uses gaps of 10 so a table can
# be slotted in without renumbering.
#
# Verified against the production dump (migrations/0001_baseline.sql, taken
# 2026-07-26): every table and view below exists in production, and the
# purgeOrder values reflect its real foreign keys.
#
# The `sync` block still lists vertical_billing and the wa_*/patient_* tables,
# which production does NOT have — legacy/patients.sql and legacy/whatsapp.sql
# were never applied there. They are kept classified so that if those
# migrations are applied later the behaviour is already decided; sync and purge
# both skip a table that is absent.

tables:

  # ── Reference data: synced prod -> sandbox ──────────────────────────────
  # Pricing inputs. Sandbox is useless without these: empty service_areas makes
  # monthlyTotal 0, and razorpay-order then rejects the payment with
  # 'selected pincodes have no billable price'.

  # syncOrder inserts parents first: service_areas.tier_number references
  # pricing_tiers, so the tiers must land before the areas that cite them.
  pricing_tiers:
    class: sync
    key: [tier_number]
    syncOrder: 10

  service_areas:
    class: sync
    key: [pin_code]
    syncOrder: 20

  # Not present in production — legacy/whatsapp.sql was never applied there.
  # Classified so the behaviour is already decided if it ever is; sync skips
  # any table that is absent.
  wa_entry_points:
    class: sync
    key: [code]
    syncOrder: 30

  # Also absent from production. The pricing edge function reads this table and
  # silently falls back to FALLBACK_RULES in _shared/pricing.ts when it is
  # missing — so commission rates are currently driven by that hardcoded map,
  # not by the database.
  vertical_billing:
    class: sync
    key: [vertical]
    syncOrder: 40

  # What we charge and who we are on an invoice. Config we author, not data
  # anyone generates — so sandbox should hold the same values as production or
  # every price it quotes is a fiction.
  #
  # syncOrder puts plans before the settings row that names one:
  # pricing_settings.override_plan_code references pricing_plans(code) with no
  # ON DELETE clause, so the plan has to exist first.
  pricing_plans:
    class: sync
    key: [code]
    syncOrder: 60

  pricing_settings:
    class: sync
    key: [id]
    syncOrder: 70

  # Our own GST registration, invoice prefix and SAC code. An invoice raised in
  # sandbox with production's real GSTIN would be wrong in an interesting way,
  # but so would one raised with nothing — synced, and edited in the SQL editor
  # rather than by anyone's code.
  tax_settings:
    class: sync
    key: [id]
    syncOrder: 80

  discount_codes:
    class: sync
    syncOrder: 50
    # CONFIRMED against the production dump: the live table has a uuid `id`
    # primary key plus discount_type/current_uses/show_on_banner — none of
    # which appear in legacy/schema.sql. That file describes a table that does
    # not exist.
    key: [id]

  # ── User-generated data: isolated, purgeable ────────────────────────────
  # Ordered children-first. payments MUST precede doctors — payments.doctor_id
  # has no ON DELETE clause, so it is NO ACTION and deleting a doctor that still
  # has payments raises an FK violation. check-table-config.mjs asserts this.

  discount_code_usage:
    class: isolated
    purgeOrder: 10

  # ── Everything that hangs off an appointment ────────────────────────────
  # Both cascade from appointments, so a purge would take them anyway. Ordered
  # explicitly regardless: relying on a cascade means the manifest stops
  # describing what actually happens, and the next person to add a table here
  # has no pattern to follow.
  appointment_events:
    class: isolated
    purgeOrder: 24

  notification_outbox:
    class: isolated
    purgeOrder: 26

  # Invoices before payments (40): invoices.payment_id points at payments. It is
  # ON DELETE SET NULL so either order survives, but a nulled payment_id on a
  # row about to be deleted is pointless work.
  invoices:
    class: isolated
    purgeOrder: 35

  # The gapless invoice series. Purged with the invoices it numbered — a
  # counter left at 47 after the invoices are gone would start the next sandbox
  # run at 48 and leave a permanent hole in the series.
  invoice_counters:
    class: isolated
    purgeOrder: 36
    pk: fy

  # Children of `ratings`, so they must be deleted before it.
  rating_responses:
    class: isolated
    purgeOrder: 12

  review_flags:
    class: isolated
    purgeOrder: 14

  ratings:
    class: isolated
    purgeOrder: 20

  # Today's OPD line (0054). Before appointments and visits, which it points at.
  opd_queue:
    class: isolated
    purgeOrder: 22

  appointments:
    class: isolated
    purgeOrder: 30

  payments:
    class: isolated
    purgeOrder: 40

  premium_slots:
    class: isolated
    purgeOrder: 50

  subscriptions:
    class: isolated
    purgeOrder: 60

  business_pricing_overrides:
    class: isolated
    purgeOrder: 70

  availability:
    class: isolated
    purgeOrder: 80

  camps_offers:
    class: isolated
    purgeOrder: 90

  # ── Patient billing (0051) ──────────────────────────────────────────────
  # A clinic charging a patient, which is NOT the invoices/payments pair — those
  # bill businesses for their listing under our GSTIN. Every FK here carries an
  # ON DELETE clause, so these sit before the encounters they reference only for
  # tidiness.
  patient_payments:
    class: isolated
    purgeOrder: 84

  patient_charges:
    class: isolated
    purgeOrder: 86

  # ── Document retention (0058) ───────────────────────────────────────────
  # Settings, not records. Purged with the business in sandbox: a retention
  # rule for a clinic that no longer exists governs nothing.
  document_retention_policies:
    class: isolated
    purgeOrder: 103
    pk: business_id

  # ── Patient bills (0056) ────────────────────────────────────────────────
  # Numbered after charges (86) and payments (84), which both carry a bill_id
  # pointing here. Every FK on a bill has an ON DELETE clause, so nothing here
  # is forced — but the convention in this file is child-first, and a stamped
  # charge is the child of the bill it was copied onto.
  patient_bill_items:
    class: isolated
    purgeOrder: 97

  patient_bills:
    class: isolated
    purgeOrder: 99

  bill_counters:
    class: isolated
    purgeOrder: 101
    pk: business_id

  # ── Discharge summaries (0055) ──────────────────────────────────────────
  # Before admissions (94) because they are its child, and — the part that
  # actually matters — before practitioners (120), for exactly the reason
  # recorded on prescriptions below: discharge_summaries.practitioner_id has no
  # ON DELETE clause, so it is NO ACTION. The document is signed by a named
  # doctor with a registration number, which is what makes it worth anything to
  # the next hospital, so that link is not something a delete may quietly sever.
  # The summary goes first or the purge raises an FK violation.
  discharge_summaries:
    class: isolated
    purgeOrder: 88

  discharge_counters:
    class: isolated
    purgeOrder: 89
    pk: business_id

  # ── Inpatients (0050) ───────────────────────────────────────────────────
  # Notes before stays, stays before beds, beds before wards — and all of them
  # before businesses. Every FK here carries an ON DELETE clause, so ordering
  # is convention rather than necessity, but the convention is what makes the
  # next addition obvious.
  admission_notes:
    class: isolated
    purgeOrder: 92

  # The occupancy timeline billing multiplies against (0053). Before admissions,
  # which it references, and before beds, whose rate it snapshots.
  admission_bed_stays:
    class: isolated
    purgeOrder: 93

  admissions:
    class: isolated
    purgeOrder: 94

  admission_counters:
    class: isolated
    purgeOrder: 95
    pk: business_id

  beds:
    class: isolated
    purgeOrder: 96

  wards:
    class: isolated
    purgeOrder: 98

  # The affiliation goes before either side of it: it is the child of both.
  business_practitioners:
    class: isolated
    purgeOrder: 100

  # A listing's branches. After availability (80), which references it, and
  # before businesses (130), which it references.
  practice_locations:
    class: isolated
    purgeOrder: 110

  # One-time login codes. Short-lived anyway; purged with the businesses they
  # authenticate.
  login_codes:
    class: isolated
    purgeOrder: 112

  # Who changed a pricing plan and when. Ours rather than a customer's, but
  # still a log of things that happened in THIS database — copying production's
  # plan history into sandbox would describe decisions nobody made here.
  pricing_plan_events:
    class: isolated
    purgeOrder: 114

  practitioners:
    class: isolated
    purgeOrder: 120

  # Patients who asked the WhatsApp bot about insurance. References businesses
  # via agent_business_id, so it goes before businesses even though the FK is
  # ON DELETE SET NULL and would survive either order.
  insurance_leads:
    class: isolated
    purgeOrder: 125

  businesses:
    class: isolated
    purgeOrder: 130

  unmet_demand_log:
    class: isolated
    purgeOrder: 150

  # ── The clinical record (0047) ──────────────────────────────────────────
  # Children first. Everything here hangs off patient_members, which hangs off
  # patients, so these must all precede it.

  # References patient_consents, so it goes before that table's own rows.
  consultation_recordings:
    class: isolated
    purgeOrder: 152

  patient_vitals:
    class: isolated
    purgeOrder: 153

  patient_allergies:
    class: isolated
    purgeOrder: 154

  patient_conditions:
    class: isolated
    purgeOrder: 155

  patient_medications:
    class: isolated
    purgeOrder: 156

  # Audit trail. Isolated rather than never_purge: a sandbox purge clears test
  # data, and an access log about deleted patients describes nothing.
  patient_record_access:
    class: isolated
    purgeOrder: 157

  # ── Prescriptions and documents (0048) ──────────────────────────────────
  # These sit BEFORE practitioners (120), not after, and the reason is the same
  # one recorded above for payments: prescriptions.practitioner_id has no
  # ON DELETE clause, so it is NO ACTION. A prescription is issued by a named
  # person and that link is not something a delete should quietly sever — which
  # means the prescription has to go first or the purge raises an FK violation.
  prescription_items:
    class: isolated
    purgeOrder: 102

  patient_documents:
    class: isolated
    purgeOrder: 104

  prescriptions:
    class: isolated
    purgeOrder: 106

  # Per-business numbering. Purged with everything else in sandbox: a counter
  # left behind would keep numbering from where the deleted data stopped.
  prescription_counters:
    class: isolated
    purgeOrder: 108
    pk: business_id

  patient_visits:
    class: isolated
    purgeOrder: 160

  patient_consents:
    class: isolated
    purgeOrder: 170

  # The clinic's patient list, and the people a phone number covers. Both must
  # go after every clinical row that references them and before `patients`.
  business_patients:
    class: isolated
    purgeOrder: 172

  patient_members:
    class: isolated
    purgeOrder: 174

  patient_import_rows:
    class: isolated
    purgeOrder: 180

  patient_imports:
    class: isolated
    purgeOrder: 190

  message_log:
    class: isolated
    purgeOrder: 200
    pk: id

  patient_profiles:
    class: isolated
    purgeOrder: 218

  # Rewards ledger — spends points, so it goes before sehat_points.
  rewards_redemptions:
    class: isolated
    purgeOrder: 205

  sehat_points:
    class: isolated
    purgeOrder: 210

  # References patient_profiles via referrer_id.
  referrals:
    class: isolated
    purgeOrder: 212

  # Anonymous pageview telemetry; no FKs, so ordering is unconstrained.
  site_visits:
    class: isolated
    purgeOrder: 255

  # Product analytics: searches, impressions, profile views. business_id is ON
  # DELETE SET NULL, so ordering is unconstrained — kept beside site_visits
  # because they are read together.
  site_events:
    class: isolated
    purgeOrder: 254

  # Where visitors were, for the coverage map. No FKs.
  visitor_locations:
    class: isolated
    purgeOrder: 256

  patients:
    class: isolated
    purgeOrder: 220

  wa_session_messages:
    class: isolated
    purgeOrder: 230

  wa_sessions:
    class: isolated
    purgeOrder: 240

  wa_contacts:
    class: isolated
    purgeOrder: 250
    # Primary key is `phone`, not `id` — the purge filter must use it.
    pk: phone

  opt_outs:
    class: isolated
    purgeOrder: 260

  # Clinics we know exist but who have not signed up, from open government
  # data. Isolated rather than sync: sandbox rebuilds it from the same public
  # source, and it is not reference data copied down from prod.
  seed_clinics:
    class: isolated
    purgeOrder: 270

  # ── The Indian Medical Register mirror ──────────────────────────────────
  # Neither synced nor purged. Not `sync`: it is not ours and does not come from
  # prod — both environments rebuild it from the register itself. Not `isolated`:
  # a sandbox purge that dropped 1.5M rows would cost an hour of re-import to
  # clear data no test ever wrote.

  imr_doctors:
    class: never_purge
    # Public register data (NMC Act 2019 s.31), rebuilt by the import job.

  imr_sync_state:
    class: never_purge
    # Import progress. Purging it would strand a half-finished run.

  # Who may open the admin panel. NOT synced: auth_uid points at a row in
  # auth.users, and production's user ids do not exist in sandbox — copying
  # them down produces admins who can never sign in. NOT purged either: the
  # purge is triggered FROM the admin panel, so wiping this table would lock
  # the person running it out of the tool they just used, with no way back
  # except the SQL editor. Sandbox admins are made by
  # scripts/seed-sandbox-accounts.mjs.
  admin_users:
    class: never_purge

  # ── Views: neither synced nor purged ────────────────────────────────────

  rating_aggregate:
    class: view

  # Discovered in the production dump; none were in any committed SQL.
  business_effective_pricing: { class: view }
  admin_revenue_summary:    { class: view }
  free_camp_quota:          { class: view }
  offer_quota:              { class: view }
  unmet_demand_summary:     { class: view }

  messageable_patients:   { class: view }
  messageable_whatsapp:   { class: view }
  messageable_sms:        { class: view }
  patient_import_summary: { class: view }
  inbound_patient_context: { class: view }
  wa_service_window_open: { class: view }
  wa_entry_point_stats:   { class: view }

  # The doctors shown under a clinic listing — name and qualification only.
  public_business_doctors: { class: view }
  public_practitioner_businesses: { class: view }

  # The clinical record's read models (0047).
  patient_summary:          { class: view }
  business_appointment_list: { class: view }
  prescription_detail:      { class: view }
  ward_occupancy:           { class: view }
  consultation_audio_to_purge: { class: view }
  admission_detail:         { class: view }
  admission_bed_history:    { class: view }
  discharge_summary_detail: { class: view }
  patient_bill_detail:      { class: view }
  patient_documents_to_purge: { class: view }
  purge_job_history:        { class: view }
  business_bills_outstanding: { class: view }
  opd_board:                { class: view }
  patient_account:          { class: view }
  business_outstanding:     { class: view }

  # Billing and plan reporting.
  invoice_register:         { class: view }
  invoice_monthly_summary:  { class: view }
  plan_enrolment:           { class: view }
  subscription_renewals_due: { class: view }
  public_tax_display:       { class: view }
  active_pricing_plan:      { class: view }
  pricing_plan_status:      { class: view }

  # Appointments and analytics.
  appointment_detail:       { class: view }
  appointment_outcomes:     { class: view }
  business_daily_stats:     { class: view }
  demand_by_area:           { class: view }
  platform_daily_stats:     { class: view }
  visitors_live:            { class: view }
  visitors_by_area:         { class: view }

  # Seed clinics offered as suggestions at signup — name and address only,
  # with our pipeline status and notes left behind in seed_clinics.
  findable_clinics:       { class: view }

  # ── Infrastructure ──────────────────────────────────────────────────────

  schema_migrations:
    class: never_purge
    # The migration ledger. Purging it would make the runner re-apply everything.
